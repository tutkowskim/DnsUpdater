name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.9.13"

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: tutkowskim/dns-updater

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image tag
        id: vars
        run: echo "tag=$(date "+%Y.%m.%d.%H%M")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Trigger update in HomeLab
        run: |
          curl -X POST https://api.github.com/repos/tutkowskim/HomeLab/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
            -d "$(jq -n \
              --arg event_type "update-docker-tag" \
              --arg image_name "${{ env.IMAGE_NAME }}" \
              --arg new_tag "${{ steps.vars.outputs.tag }}" \
              '{event_type: $event_type, client_payload: {image_name: $image_name, new_tag: $new_tag}}')"
